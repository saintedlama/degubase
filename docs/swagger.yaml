basePath: /api
definitions:
  automation.CreateScriptRequest:
    properties:
      code:
        type: string
      enabled:
        type: boolean
      event_type:
        $ref: '#/definitions/models.ScriptEventType'
      name:
        type: string
      table_ids:
        items:
          type: integer
        type: array
    type: object
  automation.UpsertEnvRequest:
    properties:
      is_secret:
        type: boolean
      key:
        type: string
      value:
        type: string
    type: object
  http.ErrorResponse:
    properties:
      code:
        example: not_found
        type: string
      error:
        example: not found
        type: string
    type: object
  identity.CreateTokenRequest:
    properties:
      name:
        type: string
    type: object
  identity.CreateUserRequest:
    properties:
      is_admin:
        type: boolean
      name:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  identity.CreateWorkspaceRequest:
    properties:
      code:
        example: MYWS
        type: string
      context:
        example: Project context
        type: string
      name:
        example: My Workspace
        type: string
    type: object
  identity.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  models.CardFieldConfig:
    properties:
      col:
        type: string
      showLabel:
        type: boolean
      style:
        type: string
      truncate:
        type: boolean
    type: object
  models.Column:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
      options:
        description: |-
          Options holds column-type-specific configuration. For single-select and multi-select columns:
          {"choices":["A","B","C"],"choiceColors":{"A":"#e41a1c","B":"#377eb8"},"palette":0}.
          Null or omitted for all other column types.
        type: object
      position:
        type: integer
      table_id:
        type: integer
      type:
        $ref: '#/definitions/models.ColumnType'
    type: object
  models.ColumnType:
    enum:
    - text
    - long-text
    - markdown
    - email
    - url
    - number
    - currency
    - percent
    - rating
    - date
    - datetime
    - checkbox
    - single-select
    - multi-select
    - file
    - image
    - symbol
    - emoji
    - created-at
    - updated-at
    - checklist
    - row-link
    type: string
    x-enum-varnames:
    - ColumnTypeText
    - ColumnTypeLongText
    - ColumnTypeMarkdown
    - ColumnTypeEmail
    - ColumnTypeURL
    - ColumnTypeNumber
    - ColumnTypeCurrency
    - ColumnTypePercent
    - ColumnTypeRating
    - ColumnTypeDate
    - ColumnTypeDatetime
    - ColumnTypeCheckbox
    - ColumnTypeSingleSelect
    - ColumnTypeMultiSelect
    - ColumnTypeFile
    - ColumnTypeImage
    - ColumnTypeSymbol
    - ColumnTypeEmoji
    - ColumnTypeCreatedAt
    - ColumnTypeUpdatedAt
    - ColumnTypeChecklist
    - ColumnTypeRowLink
  models.PagedReferencingRows:
    properties:
      data:
        items:
          $ref: '#/definitions/models.ReferencingRow'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  models.PagedRows:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Row'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  models.ReferencingRow:
    properties:
      sourceRowId:
        type: integer
      sourceRowLabel:
        type: string
      sourceTableCode:
        type: string
      sourceTableName:
        type: string
      viaColumnCode:
        type: string
      viaColumnName:
        type: string
    type: object
  models.Row:
    properties:
      created_at:
        type: string
      data:
        type: object
      id:
        type: integer
      table_id:
        type: integer
      updated_at:
        type: string
    type: object
  models.RowFilter:
    properties:
      col:
        type: string
      op:
        type: string
      value:
        type: string
    type: object
  models.RowGroup:
    properties:
      rows:
        items:
          $ref: '#/definitions/models.Row'
        type: array
      total:
        type: integer
      value:
        type: string
    type: object
  models.RowHistory:
    properties:
      annotation:
        type: string
      changed_at:
        type: string
      data:
        type: object
      entry_type:
        description: '"change" or "annotation"'
        type: string
      id:
        type: integer
      revision_id:
        type: string
      row_id:
        type: integer
    type: object
  models.RowSort:
    properties:
      col:
        type: string
      dir:
        description: '"asc" or "desc"'
        type: string
    type: object
  models.Script:
    properties:
      code:
        type: string
      created_at:
        type: string
      enabled:
        type: boolean
      event_type:
        $ref: '#/definitions/models.ScriptEventType'
      id:
        type: integer
      name:
        type: string
      table_ids:
        items:
          type: integer
        type: array
      updated_at:
        type: string
      workspace_id:
        type: integer
    type: object
  models.ScriptEnvVar:
    properties:
      id:
        type: integer
      is_secret:
        type: boolean
      key:
        type: string
      value:
        type: string
      workspace_id:
        type: integer
    type: object
  models.ScriptEventType:
    enum:
    - record.created
    - record.updated
    - record.deleted
    type: string
    x-enum-varnames:
    - ScriptEventRecordCreated
    - ScriptEventRecordUpdated
    - ScriptEventRecordDeleted
  models.ScriptExecution:
    properties:
      depth:
        type: integer
      duration_ms:
        type: integer
      ended_at:
        type: string
      event_type:
        $ref: '#/definitions/models.ScriptEventType'
      id:
        type: integer
      logs:
        items:
          $ref: '#/definitions/models.ScriptLogEntry'
        type: array
      row_id:
        type: integer
      script_id:
        type: integer
      started_at:
        type: string
      success:
        type: boolean
      table_code:
        type: string
      triggered_by_execution_id:
        type: integer
    type: object
  models.ScriptLogEntry:
    properties:
      level:
        $ref: '#/definitions/models.ScriptLogLevel'
      message:
        type: string
      ts:
        type: string
    type: object
  models.ScriptLogLevel:
    enum:
    - info
    - warn
    - error
    type: string
    x-enum-varnames:
    - ScriptLogInfo
    - ScriptLogWarn
    - ScriptLogError
  models.Skill:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      operations:
        items:
          type: string
        type: array
      table_ids:
        items:
          type: integer
        type: array
      token_id:
        type: integer
      workspace_id:
        type: integer
    type: object
  models.Table:
    properties:
      code:
        type: string
      columns:
        items:
          $ref: '#/definitions/models.Column'
        type: array
      context:
        type: string
      created_at:
        type: string
      default_view_id:
        type: integer
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      views:
        items:
          $ref: '#/definitions/models.View'
        type: array
      workspace_id:
        type: integer
    type: object
  models.User:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      name:
        type: string
      username:
        type: string
    type: object
  models.View:
    properties:
      code:
        type: string
      config:
        $ref: '#/definitions/models.ViewConfig'
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      table_id:
        type: integer
      type:
        $ref: '#/definitions/models.ViewType'
    type: object
  models.ViewConfig:
    properties:
      cardFields:
        items:
          $ref: '#/definitions/models.CardFieldConfig'
        type: array
      columnOrder:
        items:
          type: string
        type: array
      dateCol:
        type: string
      filters:
        items:
          $ref: '#/definitions/models.RowFilter'
        type: array
      groupByCol:
        type: string
      hiddenCols:
        description: column codes to hide
        items:
          type: string
        type: array
      hiddenKanbanColumns:
        description: lane values to hide
        items:
          type: string
        type: array
      hideAxisLabels:
        type: boolean
      sort:
        description: ── Shared across all views ────────────────────────────────────────────
        items:
          $ref: '#/definitions/models.RowSort'
        type: array
      timelineZoom:
        type: string
      visibleWeekdays:
        items:
          type: integer
        type: array
      xCol:
        description: used by kanban (lanes) and matrix (columns)
        type: string
      yCol:
        type: string
    type: object
  models.ViewType:
    enum:
    - tabular
    - kanban
    - card
    - matrix
    - timeline
    type: string
    x-enum-varnames:
    - ViewTypeTabular
    - ViewTypeKanban
    - ViewTypeCard
    - ViewTypeMatrix
    - ViewTypeTimeline
  models.Workspace:
    properties:
      code:
        type: string
      context:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  models.WorkspaceToken:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      prefix:
        type: string
      workspace_id:
        type: integer
    type: object
  records.BulkPatchRequest:
    properties:
      data:
        type: object
      filters:
        items:
          $ref: '#/definitions/models.RowFilter'
        type: array
      preview:
        type: boolean
    type: object
  records.BulkPatchResponse:
    properties:
      count:
        type: integer
      updated:
        type: integer
    type: object
  records.GraphEdge:
    properties:
      from:
        type: string
      to:
        type: string
      via_column:
        description: ViaColumn is the row-link column code on the source row.
        type: string
      via_column_name:
        type: string
    type: object
  records.GraphNode:
    properties:
      data:
        description: Data holds the code-keyed cell data. Null for orphaned (deleted)
          rows.
        type: object
      id:
        description: ID uniquely identifies the node as "{tableCode}:{rowID}".
        type: string
      label:
        description: |-
          Label is the best human-readable name for the row (first text column, or "Row #N").
          Deleted/orphaned rows carry their stale label with a " (deleted)" deleted suffix.
        type: string
      row_id:
        type: integer
      table:
        type: string
    type: object
  records.GraphResponse:
    properties:
      edges:
        items:
          $ref: '#/definitions/records.GraphEdge'
        type: array
      nodes:
        items:
          $ref: '#/definitions/records.GraphNode'
        type: array
      root:
        description: Root is the node ID of the starting record.
        type: string
    type: object
  records.ImportPreviewResponse:
    properties:
      columns:
        items:
          $ref: '#/definitions/models.Column'
        type: array
      headers:
        items:
          type: string
        type: array
      sample:
        items:
          items:
            type: string
          type: array
        type: array
      suggested_mapping:
        additionalProperties:
          type: string
        description: csvHeader → colCode (empty = no suggestion)
        type: object
    type: object
  records.ImportResultResponse:
    properties:
      imported:
        type: integer
    type: object
  records.RowDataRequest:
    properties:
      data:
        description: |-
          Data maps column codes to typed values. Format by column type:
          text/long-text/markdown/email/url/symbol/emoji: string;
          number/currency/percent/rating: number;
          checkbox: boolean;
          date: ISO 8601 date string e.g. "2024-01-15";
          datetime: ISO 8601 datetime string e.g. "2024-01-15T10:00:00Z";
          single-select: string matching one of the column's choices;
          multi-select: array of strings e.g. ["Bug","Feature"];
          checklist: array of {text: string, checked: boolean} objects e.g. [{"text":"Step 1","checked":false}];
          file/image: managed via the file upload endpoint, not set directly in row data.
        type: object
    type: object
  records.annotationBody:
    properties:
      annotation:
        type: string
    type: object
  schema.CreateColumnRequest:
    properties:
      name:
        example: Email
        type: string
      options:
        type: object
      type:
        allOf:
        - $ref: '#/definitions/models.ColumnType'
        example: email
    type: object
  schema.CreateTableRequest:
    properties:
      code:
        example: CUST
        type: string
      context:
        example: Stores customer records
        type: string
      icon:
        example: ri-database-2-line
        type: string
      name:
        example: Customers
        type: string
    type: object
  schema.CreateViewRequest:
    properties:
      config:
        $ref: '#/definitions/models.ViewConfig'
      name:
        example: Default
        type: string
      type:
        allOf:
        - $ref: '#/definitions/models.ViewType'
        example: tabular
    type: object
  schema.ReorderColumnsRequest:
    properties:
      codes:
        example:
        - name
        - email
        - status
        items:
          type: string
        type: array
    type: object
  schema.UpdateColumnRequest:
    properties:
      name:
        example: Email
        type: string
      options:
        type: object
      type:
        allOf:
        - $ref: '#/definitions/models.ColumnType'
        example: email
    type: object
  schema.UpdateTableRequest:
    properties:
      context:
        example: Stores customer records
        type: string
      default_view_id:
        type: integer
      icon:
        example: ri-database-2-line
        type: string
      name:
        example: Customers
        type: string
    type: object
  schema.UpdateViewRequest:
    properties:
      config:
        $ref: '#/definitions/models.ViewConfig'
      name:
        example: Default
        type: string
    type: object
  skills.CreateSkillRequest:
    properties:
      description:
        example: Access workspace data
        type: string
      name:
        example: My Skill
        type: string
      operations:
        example:
        - list
        - create
        - update
        - delete
        items:
          type: string
        type: array
      table_ids:
        items:
          type: integer
        type: array
      token_name:
        example: my-skill-token
        type: string
    type: object
  skills.PreviewSkillRequest:
    properties:
      description:
        type: string
      name:
        type: string
      operations:
        items:
          type: string
        type: array
      table_ids:
        items:
          type: integer
        type: array
    type: object
  skills.UpdateSkillRequest:
    properties:
      description:
        example: Access workspace data
        type: string
      name:
        example: My Skill
        type: string
      operations:
        example:
        - list
        - create
        - update
        - delete
        items:
          type: string
        type: array
      table_ids:
        items:
          type: integer
        type: array
    type: object
info:
  contact: {}
  description: DeguBase – workspace and table management API.
  title: DeguBase API
  version: "1.0"
paths:
  /admin/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/identity.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - admin
  /admin/users/{userID}:
    delete:
      parameters:
      - description: user ID
        in: path
        name: userID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/identity.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Logout
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /auth/setup:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Auth setup status
      tags:
      - auth
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /workspaces:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Workspace'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List workspaces
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      parameters:
      - description: workspace
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/identity.CreateWorkspaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Workspace'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create workspace
      tags:
      - workspaces
  /workspaces/{wsCode}:
    delete:
      parameters:
      - description: workspace code
        in: path
        name: wsCode
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete workspace
      tags:
      - workspaces
    get:
      parameters:
      - description: workspace code
        in: path
        name: wsCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Workspace'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get workspace
      tags:
      - workspaces
    put:
      consumes:
      - application/json
      parameters:
      - description: workspace code
        in: path
        name: wsCode
        required: true
        type: string
      - description: workspace
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/identity.CreateWorkspaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Workspace'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update workspace
      tags:
      - workspaces
  /workspaces/{wsCode}/scripts:
    get:
      parameters:
      - description: workspace code
        in: path
        name: wsCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Script'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List scripts
      tags:
      - scripts
    post:
      consumes:
      - application/json
      parameters:
      - description: workspace code
        in: path
        name: wsCode
        required: true
        type: string
      - description: script
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/automation.CreateScriptRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Script'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create script
      tags:
      - scripts
  /workspaces/{wsCode}/scripts/{scriptID}:
    delete:
      parameters:
      - description: workspace code
        in: path
        name: wsCode
        required: true
        type: string
      - description: script ID
        in: path
        name: scriptID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete script
      tags:
      - scripts
    get:
      parameters:
      - description: workspace code
        in: path
        name: wsCode
        required: true
        type: string
      - description: script ID
        in: path
        name: scriptID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Script'
        "404":
